# /etc/nginx/sites-available/api.conf — reverse proxy for the API.
# Replace api.YOUR_DOMAIN, then: ln -s to sites-enabled, nginx -t, systemctl reload nginx.
# TLS: certbot --nginx -d api.YOUR_DOMAIN
server {
  listen 80;
  server_name api.YOUR_DOMAIN;

  # Raise if the API accepts uploads (default 1M rejects them with a 413).
  client_max_body_size 10m;

  location / {
    proxy_pass http://127.0.0.1:3001;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
