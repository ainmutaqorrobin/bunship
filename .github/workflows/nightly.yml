name: Nightly stack matrix

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  # Pinned scaffolders, both OSes — proves the shipped experience end to end.
  matrix:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        combo:
          - { web: next, api: nest }
          - { web: react-vite, api: hono }
          - { web: nuxt, api: fastify }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.x
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: bun install --frozen-lockfile
      - run: bun run build
        working-directory: packages/cli
      - name: Scaffold
        shell: bash
        run: |
          git config --global user.email nightly@example.com
          git config --global user.name nightly
          node packages/cli/dist/index.mjs "$RUNNER_TEMP/demo" \
            --web ${{ matrix.combo.web }} --api ${{ matrix.combo.api }} --docker --cicd --json
      - name: Generated repo must pass its own gate
        shell: bash
        working-directory: ${{ runner.temp }}/demo
        run: |
          bun run check
          bun run build

  # Same flow with version pins stripped — catches upstream scaffolder flag drift
  # before users hit it.
  canary:
    strategy:
      fail-fast: false
      matrix:
        combo:
          - { web: next, api: nest }
          - { web: react-vite, api: hono }
          - { web: nuxt, api: fastify }
    runs-on: ubuntu-latest
    env:
      SCAFFOLDER_CANARY: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.x
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: bun install --frozen-lockfile
      - run: bun run build
        working-directory: packages/cli
      - name: Scaffold against @latest scaffolders
        shell: bash
        run: |
          git config --global user.email nightly@example.com
          git config --global user.name nightly
          node packages/cli/dist/index.mjs "$RUNNER_TEMP/demo" \
            --web ${{ matrix.combo.web }} --api ${{ matrix.combo.api }} --docker --cicd --json
      - name: Generated repo must pass its own gate
        shell: bash
        working-directory: ${{ runner.temp }}/demo
        run: |
          bun run check
          bun run build
